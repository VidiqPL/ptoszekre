<!doctype html>
<!-- Based on ptoszek.pl by Jaczup: https://github.com/jaczup/ptoszek.pl -->
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ptoszek</title>
  <meta name="description" content="Obejrzyj zdjęcia Ptaków za frytę!">
  <meta name="theme-color" content="#34eb7d">
  <link rel="icon" href="/media/images/ptok.jpg">
  <link rel="stylesheet" href="/styles/ptoszek.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <noscript>Po coś tego JavaScript wyłączył bamboszu!</noscript>
  <div class="hello-message" id="intro">
    <h1>Siemano kolano!</h1>
    <h2>We no rusz myszką.</h2>
    <h3>(na telefonie dotknij ptoszka)</h3>
    <button class="bird-button" id="start" aria-label="Kliknij w ptoszka"><img src="/media/images/intro.gif" alt="Cute ptok" width="300" height="300"></button>
  </div>
  <div id="experience" hidden>
    <div id="stage"><video id="bird-video" autoplay loop playsinline preload="none" aria-label="Ptoszek"></video></div>
    <div class="logout-messages" id="effects" aria-hidden="true"></div>
    <div class="status-messages"><p id="status" role="status"></p><p id="audio-status" role="status"></p></div>
    <details class="spy-console" id="spy-console" hidden>
      <summary>🐦 Ptoszek wie o Tobie…</summary>
      <dl id="browser-facts"></dl>
      <p>To dane z Twojej przeglądarki. Zostają tutaj.<br>Uważaj, w jakie linki klikasz.</p>
      <small>Esc — koniec ptoszkowania</small>
    </details>
  </div>
</body>
</html>
