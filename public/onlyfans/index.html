<!doctype html>
<!-- Based on ptoszek.pl by Jaczup: https://github.com/jaczup/ptoszek.pl -->
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ptoszek</title>
  <meta name="description" content="Obejrzyj zdjęcia Ptaków za frytę!">
  <meta name="theme-color" content="#34eb7d">
  <link rel="icon" href="/media/images/ptok.jpg">
  <link rel="stylesheet" href="/styles/ptoszek.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <noscript>Po coś tego JavaScript wyłączył bamboszu!</noscript>
  <div class="hello-message" id="intro">
    <h1>Siemano kolano!</h1>
    <h2>We no walnij 3 razy w spacje.</h2>
    <h3>(albo kliknij w ptoszka)</h3>
    <button class="bird-button" id="start" aria-label="Kliknij w ptoszka"><img src="/media/images/intro.gif" alt="Cute ptok" width="300" height="300"></button>
  </div>
  <div id="experience" hidden>
    <div id="stage"><video id="bird-video" autoplay loop playsinline controls preload="none" aria-label="Ptoszek"></video></div>
    <div class="logout-messages" id="effects" aria-hidden="true"></div>
    <div class="demo-controls">
      <button id="stop">Stop (Esc)</button>
      <button id="more-birds">Więcej ptoszków</button>
      <button id="next-video">Inny film</button>
      <button id="mute" aria-pressed="false">Wycisz</button>
      <button id="fullscreen">Pełny ekran</button>
      <button id="show-console">Spy Console</button>
      <span id="status" role="status"></span>
    </div>
    <aside class="spy-console" id="spy-console" aria-label="Ptoszek Spy Console" hidden>
      <h2>Ptoszek Spy Console</h2>
      <dl id="browser-facts"></dl>
      <p>Te informacje pochodzą z Twojej przeglądarki. Niczego nie wysyłamy. Uważaj na nieznane linki!</p>
      <button id="close-console">Rozumiem</button>
    </aside>
  </div>
</body>
</html>
